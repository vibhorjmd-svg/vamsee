<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join a VAMSEE workspace</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6f9;color:#172b3b;font:15px/1.5 Inter,system-ui,Arial}.card{max-width:460px;margin:10vh auto;background:white;padding:32px;border:1px solid #e3eaf0;border-radius:16px;box-shadow:0 18px 55px #102b4612}.logo{font-weight:900;letter-spacing:2px;font-size:23px;color:#102b46}.logo span{color:#f49b45}h1{font-size:25px;margin:32px 0 4px}.muted{color:#718397;font-size:13px}.field{display:grid;gap:6px;margin:17px 0}.field label{font-size:12px;font-weight:700}.field input{padding:12px;border:1px solid #dce5ec;border-radius:9px;font:inherit}.btn{width:100%;padding:13px;border:0;border-radius:9px;background:#f49b45;font-weight:800;cursor:pointer}.msg{font-size:13px;color:#b5444e;margin-top:12px;min-height:20px}</style></head><body><main class="card"><div class="logo">VAM<span>SEE</span></div><h1>Join your team</h1><p class="muted">Create your password to activate your VAMSEE workspace access.</p><form id="form"><div class="field"><label>New password (minimum 12 characters)</label><input id="password" type="password" minlength="12" maxlength="128" required autocomplete="new-password"></div><button class="btn" id="submit">Accept invitation</button><div class="msg" id="msg"></div></form></main><script>const token=new URLSearchParams(location.search).get("token");const $=id=>document.getElementById(id);$("form").addEventListener("submit",async e=>{e.preventDefault();if(!token){$("msg").textContent="Invitation link is missing its token.";return;}$("submit").disabled=true;try{const r=await fetch("/api/auth/accept-invitation",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,password:$("password").value})});const d=await r.json();if(!r.ok)throw new Error(d.error||"Unable to accept invitation");location.href="/desk.html";}catch(err){$("msg").textContent=err.message;}finally{$("submit").disabled=false;}});</script></body></html>
