name: Deploy VAMSEE to Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Verify Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing GitHub Actions secret: CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing GitHub Actions secret: CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Deploy Worker, static assets, D1 and AI bindings
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Smoke-test deployed public pages and auth session endpoint
        run: |
          set -euo pipefail
          BASE_URL="https://black-smoke-f08f.vibhorjmd.workers.dev"
          for path in / /app.html; do
            curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors "$BASE_URL$path" -o /dev/null
            echo "PASS: $path is serving"
          done
          SESSION="$(curl --fail --silent --show-error "$BASE_URL/api/auth/session")"
          node -e 'const d=JSON.parse(process.argv[1]); if(typeof d.authenticated!=="boolean") process.exit(1); console.log("PASS: auth session endpoint returns valid unauthenticated/authenticated state")' "$SESSION"
